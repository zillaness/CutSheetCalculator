# file: pages.yml
# version: 2.2
# author: Sam Cao
# created: 2026-09-04
# last_updated: 2026-09-04
# description: CI + GitHub Pages. Runs the test suite on every push and pull request, rebuilds web/index.html from the engine, and deploys the web/ folder to Pages from the repository's default branch. One-time setup: Settings -> Pages -> Source: GitHub Actions.
# ai_update: Update last_updated and version. Append changelog at bottom.
name: Test and publish static page
on:
  push:
    paths-ignore: [BURNDOWN.md]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libcairo2
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Rebuild the static page from the engine
        run: python web/build_web.py
      - name: Fail if the committed page was stale
        run: |
          if ! git diff --exit-code -- web/index.html; then
            echo "web/index.html is stale. Run 'python web/build_web.py' and commit the result."
            exit 1
          fi
      - run: python -m pytest -q tests
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - id: deployment
        uses: actions/deploy-pages@v4
# CHANGELOG
# v1.0 (2026-09-04): Initial release.
# v2.0 (2026-09-04): Test job on every push/PR with page rebuild + staleness check; deploy gated on the default branch instead of a hard-coded main.
# v2.1 (2026-09-04): libcairo2 for the PDF export; default Playwright browser path.
# v2.2 (2026-09-04): Ledger-only pushes do not trigger a run.
